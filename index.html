<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TASK 04 - To-Do Web App</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#242332;color:#fff;font-family:'Space Grotesk',sans-serif;display:flex;justify-content:center;padding:24px;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(500px at 10% 10%,rgba(63,209,197,.14),transparent),radial-gradient(500px at 90% 90%,rgba(100,140,255,.18),transparent)}
.shape{position:fixed;pointer-events:none;z-index:1}
.s1{top:0;left:0;width:160px;height:90px;border:10px solid #3fd1c7;border-left:0;border-top:0;border-radius:0 0 70px 0}
.s2{top:12px;right:0;width:85px;height:46px;background:#6a90d8;border-radius:40px 0 0 40px}
.s3{bottom:0;left:0;width:130px;height:90px;border:12px solid #6a90d8;border-left:0;border-bottom:0;border-radius:0 90px 0 0;opacity:.8}
.s4{bottom:0;right:0;width:140px;height:140px;border:12px solid #3fd1c7;border-right:0;border-bottom:0;border-radius:90px 0 0 0}
.dots{position:fixed;right:24px;bottom:24px;display:grid;grid-template-columns:repeat(7,4px);gap:8px;opacity:.4}
.dots i{width:4px;height:4px;background:#e8c97a;border-radius:50%;display:block}

.wrap{position:relative;z-index:2;width:100%;max-width:1120px;display:grid;grid-template-columns:1fr 440px;gap:28px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.badge{border:1.5px solid #ff3b5a;padding:7px 22px;font-weight:800;font-size:13px;letter-spacing:.1em;display:inline-block}
.title{font-size:40px;line-height:.95;font-weight:800;margin-top:18px}
.title span{font-size:14px;opacity:.6;letter-spacing:.25em;display:block;margin-top:8px;font-weight:400}
.desc{margin-top:16px;opacity:.8;font-size:13.5px;line-height:1.7;max-width:400px}

.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);border-radius:24px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.input-row{display:flex;gap:8px}
.input{flex:1;padding:14px 14px;border-radius:14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);color:#fff;font-family:'Space Grotesk';font-size:14px}
.input:focus{outline:none;border-color:#3fd1c7;box-shadow:0 0 0 3px rgba(63,209,197,.15)}
.dt{width:170px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:12px;letter-spacing:.08em;cursor:pointer;transition:.2s}
.btn-add{background:#fff;color:#000}
.btn-add:hover{background:#3fd1c7;box-shadow:0 0 20px #3fd1c766;transform:translateY(-1px)}
.btn:active{transform:scale(.96)}

.filters{display:flex;gap:8px;margin-top:14px}
.f{padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:11px;letter-spacing:.08em;cursor:pointer}
.f.active{background:#fff;color:#000}

.list{margin-top:14px;display:grid;gap:10px;max-height:52vh;overflow:auto;padding-right:4px}
.task{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;animation:pop.35s cubic-bezier(.34,1.56,.64,1);transition:.2s}
@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.task.done{opacity:.55}
.task.done.tname{text-decoration:line-through}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid rgba(255,255,255,.25);display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:.2s}
.check.on{background:#3fd1c7;border-color:#3fd1c7;color:#000}
.meta{flex:1;min-width:0}
.tname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdate{font-family:'JetBrains Mono';font-size:10px;opacity:.6;margin-top:2px}
.actions{display:flex;gap:6px}
.ic{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;cursor:pointer}
.ic:hover{background:rgba(255,255,255,.15)}
.empty{text-align:center;padding:40px 10px;opacity:.5;font-size:13px}
</style>
</head>
<body>
<div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div><div class="shape s4"></div>
<div class="dots"><i></i><i></i><i></i><i></i></div>

<div class="wrap">
  <div>
    
    <div class="title">TO-DO WEB APP</div>
    <div class="title"><span>ORGANIZE • EDIT • REMIND</span></div>
    <div class="desc">
      Develop a basic to-do app that enables a user to add maintain tasks.<br><br>
      Allow users to add/organize items in lists. Mark them Completed, Edit them, Set Date & Time of tasks.
      <br><br><small style="opacity:.5">SkillCraft Technology • LocalStorage • Animated</small>
    </div>
  </div>

  <div class="card">
    <div class="input-row">
      <input class="input" id="taskInput" placeholder="Add a new task... (e.g., Submit report)">
      <input class="input dt" id="dateInput" type="datetime-local">
      <button class="btn btn-add" id="addBtn">ADD +</button>
    </div>
    <div class="filters">
      <button class="f active" data-f="all">ALL</button>
      <button class="f" data-f="pending">PENDING</button>
      <button class="f" data-f="done">COMPLETED</button>
      <span style="margin-left:auto;font-family:'JetBrains Mono';font-size:11px;opacity:.6" id="count">0 tasks</span>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
let tasks=JSON.parse(localStorage.getItem('todo_tasks')||'[]');
let filter='all';
const taskInput=document.getElementById('taskInput'), dateInput=document.getElementById('dateInput'), addBtn=document.getElementById('addBtn'), list=document.getElementById('list'), count=document.getElementById('count');

function save(){localStorage.setItem('todo_tasks',JSON.stringify(tasks))}
function fmt(d){if(!d) return 'No deadline'; let dt=new Date(d); return dt.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}

function render(){
 let filtered=tasks.filter(t=> filter==='all'? true : filter==='done'? t.done :!t.done);
 count.textContent=`${filtered.length} tasks • ${tasks.filter(t=>!t.done).length} pending`;
 if(!filtered.length){list.innerHTML=`<div class="empty">No tasks here.<br>Add your first task above ✨</div>`; return}
 list.innerHTML=filtered.map(t=>{
  let idx=tasks.indexOf(t);
  return `<div class="task ${t.done?'done':''}">
   <div class="check ${t.done?'on':''}" onclick="toggle(${idx})">${t.done?'✓':''}</div>
   <div class="meta">
     <div class="tname" ondblclick="edit(${idx})">${t.name}</div>
     <div class="tdate">📅 ${fmt(t.date)} • ${t.done?'Completed':'Pending'}</div>
   </div>
   <div class="actions">
     <button class="ic" onclick="edit(${idx})" title="Edit">✎</button>
     <button class="ic" onclick="removeTask(${idx})" title="Delete">✕</button>
   </div>
  </div>`;
 }).join('');
}
function addTask(){
 let name=taskInput.value.trim(); if(!name) return;
 let date=dateInput.value;
 tasks.unshift({name,date,done:false,created:Date.now()});
 taskInput.value=''; dateInput.value=''; save(); render();
}
function toggle(i){tasks[i].done=!tasks[i].done; save(); render();}
function removeTask(i){tasks.splice(i,1); save(); render();}
function edit(i){
 let newName=prompt('Edit task:', tasks[i].name);
 if(newName===null) return;
 let newDate=prompt('Edit date/time (YYYY-MM-DDTHH:MM) or leave empty:', tasks[i].date||'');
 if(newName.trim()){tasks[i].name=newName.trim(); if(newDate!==null) tasks[i].date=newDate.trim(); save(); render();}
}

addBtn.onclick=addTask;
taskInput.addEventListener('keydown',e=>{if(e.key==='Enter') addTask()});

document.querySelectorAll('.f').forEach(b=>{
 b.onclick=()=>{document.querySelectorAll('.f').forEach(x=>x.classList.remove('active')); b.classList.add('active'); filter=b.dataset.f; render();}
});

// default date = now +1h
let d=new Date(); d.setHours(d.getHours()+1); dateInput.value=d.toISOString().slice(0,16);

render();
</script>
</body>
</html>
